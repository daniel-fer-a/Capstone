<script>
'use strict';
// Reglas de una maqueta local. No implementan una política institucional ni una API.
const LABELS = { received: 'Recibida', under_review: 'En revisión', approved: 'Aprobada', rejected: 'Rechazada' };
function initialDraft(legal = 'natural') {
  return { membership: 'member', legal, name: '', givenNames: '', surnames: '', age: '', identifier: '', organizationName: '', organizationId: '', representativeName: '', representativeId: '', email: '', address: '', aiActivity: '', declaration: false, documents: [], sponsorsVerified: false };
}
function sampleDraft(legal = 'natural') {
  return { ...initialDraft(legal), name: 'Persona de Ejemplo', givenNames: 'Persona', surnames: 'de Ejemplo', age: '32', identifier: 'IDENTIFICACION-DEMO-01', organizationName: 'Organización de ejemplo', organizationId: 'ORGANIZACION-DEMO-01', representativeName: 'Representante de ejemplo', representativeId: 'REPRESENTANTE-DEMO-01', email: 'postulante@example.org', address: 'Domicilio de ejemplo, Santiago', aiActivity: 'Investigación y desarrollo de soluciones de inteligencia artificial, con participación en iniciativas de la comunidad.', declaration: false, documents: legal === 'juridica' ? ['vigencia', 'personeria', 'estatutos'].map(kind => ({ kind, name: `${kind}_ejemplo.pdf`, size: 125000, type: 'application/pdf' })) : [], sponsorsVerified: true };
}
function validateIdentity(d) {
  const errors = {};
  const fields = d.legal === 'natural' ? ['givenNames', 'surnames', 'identifier'] : ['organizationName', 'organizationId', 'representativeName', 'representativeId'];
  for (const field of [...fields, 'email', 'address', 'aiActivity']) {
    if (!String(d[field] ?? '').trim()) errors[field] = 'Completa este dato.';
  }
  const max = { givenNames: 255, surnames: 255, name: 255, identifier: 80, organizationName: 255, organizationId: 80, representativeName: 255, representativeId: 80, email: 255, address: 500, aiActivity: 10000 };
  for (const field of [...fields, 'email', 'address', 'aiActivity']) if (Array.from(String(d[field] ?? '').trim()).length > max[field]) errors[field] = `Máximo ${max[field]} caracteres.`;
  if (d.legal === 'natural' && (String(d.age).trim() === '' || !Number.isInteger(Number(d.age)) || Number(d.age) < 0)) errors.age = 'Ingresa la edad en años completos.';
  if (d.legal === 'natural' && `${d.givenNames} ${d.surnames}`.trim().length > 255) errors.givenNames = 'Los nombres y apellidos combinados superan el límite técnico de 255 caracteres.';
  if (d.email && !/^[^\s@]+@[^\s@]+$/.test(d.email.trim())) errors.email = 'Ingresa un correo válido.';
  return errors;
}
function fileError(file) {
  if (!/\.(pdf|jpe?g|png)$/i.test(file.name) || (file.type && !['application/pdf','image/jpeg','image/png'].includes(file.type))) return 'Usa PDF, JPG o PNG.';
  if (!file.size || file.size > 5 * 1024 * 1024) return 'Selecciona un archivo no vacío de hasta 5 MB.';
  return '';
}
function validateEvidence(d) {
  const errors = {};
  for (const f of d.documents) { const message = fileError(f); if (message) errors[f.kind] = message; }
  if (d.legal === 'juridica') {
    for (const kind of ['vigencia','personeria','estatutos']) if (!d.documents.some(f => f.kind === kind)) errors[kind] = 'Adjunta este antecedente.';
  }
  if (d.membership === 'member' && !d.sponsorsVerified) errors.sponsors = 'Se requiere la verificación de dos patrocinadores distintos.';
  return errors;
}
function displayName(d) { return d.legal === 'juridica' ? d.organizationName : `${d.givenNames} ${d.surnames}`.trim(); }
function receiveApplication(draft, id, now = '2026-10-23T10:00:00-03:00') {
  if (Object.keys({ ...validateIdentity(draft), ...validateEvidence(draft) }).length || !draft.declaration) throw new Error('Revisa los datos y confirma el envío.');
  return { ...structuredClone(draft), id, reference: id, email: draft.email.trim().toLowerCase(), status: 'received', attempt: 1, lineage: [], pendingCorrection: false, appeal: { status: 'none' }, decisions: [], submittedAt: now, decisionReason: '', history: [{ action: 'Postulación recibida', at: now, actor: 'Postulante' }] };
}
function startReview(app, at) {
  if (app.status !== 'received') throw new Error('Solo una solicitud recibida puede iniciar revisión.');
  return { ...structuredClone(app), status: 'under_review', history: [...app.history, { action: 'Revisión iniciada', at, actor: 'Directorio' }] };
}
function requestCorrection(app, reason, at) {
  if (app.status !== 'under_review' || app.pendingCorrection) throw new Error('La solicitud debe estar en revisión y sin otra corrección pendiente.');
  if (!String(reason).trim()) throw new Error('Indica los antecedentes que deben completarse.');
  return { ...structuredClone(app), pendingCorrection: true, correctionReason: reason.trim(), history: [...app.history, { action: 'Subsanación solicitada', at, actor: 'Directorio', detail: reason.trim() }] };
}
function answerCorrection(app, answer, at) {
  if (app.status !== 'under_review' || !app.pendingCorrection) throw new Error('No hay una subsanación abierta.');
  if (!String(answer).trim()) throw new Error('Escribe tu respuesta a la observación.');
  return { ...structuredClone(app), pendingCorrection: false, correctionResponse: answer.trim(), history: [...app.history, { action: 'Respuesta a observación recibida', at, actor: 'Postulante', detail: answer.trim() }] };
}
function decideApplication(app, decision, reason, at) {
  if (app.status !== 'under_review' || !['approved','rejected'].includes(decision)) throw new Error('La resolución requiere una solicitud en revisión.');
  if (!String(reason).trim()) throw new Error('Registra el fundamento de la resolución.');
  if (app.pendingCorrection) throw new Error('Primero atiende la subsanación abierta.');
  const resolution = { body: 'Directorio', result: decision, reason: reason.trim(), at };
  return { ...structuredClone(app), status: decision, decisionReason: reason.trim(), directorResolution: resolution, decisions: [...app.decisions, resolution], closedAt: at, history: [...app.history, { action: `Resolución: ${LABELS[decision].toLowerCase()}`, at, actor: 'Directorio', detail: reason.trim() }] };
}
function rejectionCount(app) { return app.decisions.filter(d => d.result === 'rejected').length; }
function lodgeAppeal(app, reason, at) {
  if (app.status !== 'rejected' || !app.directorResolution) throw new Error('Este recorrido corresponde a una resolución de rechazo del Directorio.');
  if (app.appeal.status !== 'none') throw new Error('Ya existe una apelación; otros recursos requieren definición institucional.');
  if (!String(reason).trim()) throw new Error('Escribe el fundamento de la apelación.');
  return { ...structuredClone(app), appeal: { status: 'submitted', reason: reason.trim(), submittedAt: at, reference: 'AP-' + app.id }, history: [...app.history, { action: 'Apelación presentada a la Asamblea', at, actor: 'Postulante', detail: reason.trim() }] };
}
function recordAssemblyDecision(app, outcome, reason, agreement, at, actor) {
  if (!actor?.canRecordAssembly) throw new Error('Registrar un acuerdo de Asamblea requiere una autorización específica.');
  if (app.appeal.status !== 'submitted' || !['maintain', 'uphold'].includes(outcome)) throw new Error('No hay una apelación abierta para resolver.');
  if (!String(reason).trim() || !String(agreement).trim()) throw new Error('Registra fundamento y referencia del acuerdo.');
  const resolution = { body: 'Asamblea', result: outcome === 'maintain' ? 'rejected' : 'appeal_upheld', reason: reason.trim(), agreement: agreement.trim(), at, recordedBy: actor.displayName };
  return { ...structuredClone(app), appeal: { ...app.appeal, status: outcome === 'maintain' ? 'maintained' : 'upheld_pending_effect', resolution }, decisions: [...app.decisions, resolution], history: [...app.history, { action: outcome === 'maintain' ? 'Asamblea mantiene el rechazo' : 'Asamblea acoge la apelación; efecto pendiente de registrar', at, actor: 'Asamblea', detail: reason.trim() }] };
}
function newAttempt(previous, draft, id, policy, now) {
  if (policy !== 'allowed') throw new Error(policy === 'denied' ? 'La regla del escenario no permite una nueva postulación.' : 'La CCHIA debe confirmar la regla de repostulación.');
  if (previous.appeal.status === 'submitted') throw new Error('Hay una apelación abierta del expediente anterior.');
  if (previous.appeal.status === 'upheld_pending_effect') throw new Error('Primero debe registrarse y ejecutarse el efecto del acuerdo que acogió la apelación.');
  if (previous.status !== 'rejected') throw new Error('Este recorrido parte de una resolución de rechazo cerrada.');
  if (id === previous.id || previous.lineage.some(a => a.id === id)) throw new Error('La nueva postulación necesita otro identificador y folio.');
  const app = receiveApplication(draft, id, now);
  const snapshot = { id: previous.id, reference: previous.reference, status: previous.status, decisionReason: previous.decisionReason, closedAt: previous.closedAt, attempt: previous.attempt };
  return { ...app, attempt: previous.attempt + 1, previousId: previous.id, lineage: [...structuredClone(previous.lineage), snapshot] };
}

function prepareScenario(view, options={}) {
 const cases=makeCases();
 if(['M09','M10','M11','M12'].includes(view))S.draft=sampleDraft(options.legal??(view==='M10'?'juridica':view==='M09'?'natural':S.draft.legal));
 if(view==='M13')S.current=cases.received;
 const known={'M14-received':cases.received,'M14-rejected':cases.rejected,'M14-appealed':cases.appealed,'M14-confirmed':cases.confirmed,'M14-correction':cases.correction,R01:cases.rejected,R02:cases.appealed,R03:cases.correction,R04:cases.confirmed};
 if(known[view])S.current=structuredClone(known[view]);
 if(view==='M14-upheld')S.current=recordAssemblyDecision(cases.appealed,'uphold','La Asamblea acoge la apelación. Se debe registrar el efecto concreto de su acuerdo.','ACTA-DEMO-024',nowDemo(),{canRecordAssembly:true,displayName:'Operador autorizado de demostración'});
 if(['M16','M16-dialog'].includes(view))S.current=structuredClone(cases.company);
 S.denied=view==='N01-denied';
 if(['M15','M16','M16-dialog','N01','N01-denied','R02'].includes(view))S.authenticated=true;
 S.canRecordAssembly=view==='R02';
 if(options.sponsorsVerified!==undefined)S.draft.sponsorsVerified=options.sponsorsVerified;
}
function go(view, options={}) {
 closeDialog();
 document.getElementById('toast')?.remove();
 captureIdentity();
 if(options.seed)prepareScenario(view,options);
 const privateView=['M15','M16','M16-dialog','N01','N01-denied','R02'].includes(view);
 if(privateView&&!S.authenticated)view='M02';
 if(privateView&&S.denied)view='N01-denied';
 S.view=view;S.errors={};S.message='';
 history.replaceState(null,'','#'+view);
 render();
 if(options.focus!==false)requestAnimationFrame(focusPage);
 if(view==='M16-dialog')queueMicrotask(()=>openDialog('rejected'));
}

 if(v==='R02')return 'Escenario de operador con permiso específico para registrar un acuerdo ya adoptado por la Asamblea. No es una votación ni un rol técnico nuevo.';
 if(v==='R03')return 'Subsanación: propuesta de aclaración previa a la resolución. No es un rechazo ni reinicia la recepción de la solicitud.';
 if(v==='R04')return 'Nueva postulación: procedimiento distinto de la apelación, sujeto a una regla institucional expresa. Cambia el escenario con el selector superior.';

 else if(v==='M16'||v==='M16-dialog')body=detailPage();
 else if(v==='R01')body=appealPage();
 else if(v==='R02')body=assemblyPage();
 else if(v==='R03')body=correctionPage();
 else if(v==='R04')body=reapplicationPage();
 main.innerHTML=productHeader(privateView)+body+footer();
 const match=SCREEN_OPTIONS.some(([id])=>id===v)?v:v==='M14-result'?'M14-received':'M01';
 picker.value=match;
 document.getElementById('scenario-caption').textContent=caption();
 document.getElementById('sponsors-demo').hidden=v!=='M11';
 document.getElementById('example-button').hidden=!['M09','M10','M11','M12','M14','M02','M03','M05'].includes(v);
 document.getElementById('live').textContent=(SCREEN_OPTIONS.find(([id])=>id===v)?.[1]??'Estado de la solicitud')+'; maqueta local';
 document.title='CCHIA · Maqueta de alta fidelidad';
}
function toast(text) {
 document.getElementById('toast')?.remove();
 const div=document.createElement('div');div.id='toast';div.className='toast';div.setAttribute('role','status');div.textContent=text;document.body.append(div);setTimeout(()=>div.remove(),4500);
}
function openDialog(type) {
 document.getElementById('action-dialog')?.remove();S.dialog=type;
 const d=document.createElement('dialog');d.id='action-dialog';d.setAttribute('aria-labelledby','dialog-title');
 const correction=type==='correction',documentPreview=type==='document';
 const title=documentPreview?'Documento de demostración':correction?'Solicitar subsanación':type==='approved'?'Confirmar aprobación':'Confirmar rechazo';
 d.innerHTML=`<div class="dialog-content"><div class="dialog-header"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-action="close-dialog" aria-label="Cerrar diálogo">${icon('close')}</button></div>${documentPreview?'<p>La maqueta representa la consulta privada de un documento. No se ha conectado ningún archivo institucional.</p><div class="notice">Los documentos de las pantallas son ejemplos ficticios.</div><div class="actions"><button class="button primary" data-action="close-dialog">Cerrar</button></div>':`<p>${correction?'Indica qué antecedentes deben aclararse antes de resolver.':`Registra el fundamento de la resolución para ${esc(S.current.reference)}.`}</p><form id="${correction?'correction-request-form':'decision-form'}" novalidate><div id="dialog-error" class="field-error" role="alert"></div><div class="field"><label for="decision-reason">${correction?'Antecedentes solicitados':'Fundamento comunicado al postulante'}</label><textarea id="decision-reason" name="reason" rows="5" required maxlength="10000"></textarea><p class="help">${correction?'La observación se agrega al expediente y no cuenta como rechazo.':'El fundamento forma parte del resultado que verá el postulante. Evita incluir información de terceros.'}</p></div>${!correction?`<div class="notice ${type==='rejected'?'red':''}">${type==='rejected'?'El rechazo queda registrado y el postulante puede apelar ante la Asamblea.':'La aprobación de la solicitud no se representa como creación automática de membresía.'}</div>`:''}<div class="actions"><button type="button" class="button secondary" data-action="close-dialog">Cancelar</button><button type="submit" class="button ${type==='rejected'?'danger':'primary'}">${correction?'Solicitar antecedentes':'Registrar resolución'}</button></div></form>`}</div>`;
 document.body.append(d);d.showModal();
}
function closeDialog(){document.getElementById('action-dialog')?.close();document.getElementById('action-dialog')?.remove();S.dialog=null;}
function validateFileInput(input) {
 const file=input.files?.[0];if(!file)return null;
 const error=fileError(file);if(error)throw new Error(error);
 return {name:file.name,size:file.size,type:file.type};
}
function downloadReceiptDemo() {
 const text=`CCHIA · COMPROBANTE DE MAQUETA\nFolio ficticio: ${S.current.reference}\nCódigo ficticio: DEMO-SEGUIMIENTO\nEstado representado: ${LABELS[S.current.status]}\nNo acredita una postulación real.\n`;
 const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='CCHIA_Comprobante_DEMO.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function fillExample() {
 if(['M09','M10','M11','M12'].includes(S.view)){S.draft=sampleDraft(S.view==='M10'?'juridica':S.draft.legal);render();return;}
 if(S.view==='M14'){document.getElementById('lookup-reference').value='CCHIA-DEMO-003';document.getElementById('lookup-code').value='DEMO-SEGUIMIENTO';return;}
 if(S.view==='M02'){document.getElementById('auth-email').value='cuenta@example.org';document.getElementById('auth-password').value='SOLO-DEMO';return;}
 if(S.view==='M03')document.getElementById('recovery-email').value='cuenta@example.org';
 if(S.view==='M05'){document.getElementById('new-password').value='SOLO-DEMO';document.getElementById('confirm-password').value='SOLO-DEMO';}
}
picker.addEventListener('change',()=>go(picker.value,{seed:true}));
document.getElementById('policy-picker').addEventListener('change',event=>{S.policy=event.target.value;render();});
document.getElementById('example-button').addEventListener('click',fillExample);
document.getElementById('sponsors-demo').addEventListener('click',()=>{S.draft.sponsorsVerified=true;delete S.errors.sponsors;render();toast('Se cargaron dos patrocinios distintos de demostración.');});
document.getElementById('reset-demo').addEventListener('click',()=>{S.cases=makeCases();S.current=S.cases.received;S.draft=initialDraft();S.policy='pending';S.previous=null;S.authenticated=false;S.denied=false;S.canRecordAssembly=false;document.getElementById('policy-picker').value='pending';go('M01');});
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action],[data-go],[data-filter],[data-open],[data-decision]');if(!target)return;
 event.preventDefault();
 if(target.dataset.go){go(target.dataset.go);return;}
 if(target.dataset.filter){S.adminFilter=target.dataset.filter;render();return;}
 if(target.dataset.open){const app=listingRows().find(a=>a.id===target.dataset.open);if(app){S.current=app;go('M16');}return;}
 if(target.dataset.decision){openDialog(target.dataset.decision);return;}
 const action=target.dataset.action;
 if(action==='home')go('M01');
 if(action==='choose-natural'||action==='choose-company'){S.previous=null;S.draft=initialDraft(action==='choose-company'?'juridica':'natural');go(action==='choose-company'?'M10':'M09');}
 if(action==='back-identity')go(S.draft.legal==='juridica'?'M10':'M09');
 if(action==='current-status')go('M14-result');
 if(action==='logout'){S.authenticated=false;S.canRecordAssembly=false;S.denied=false;go('M02');}
 if(action==='start-review'){try{updateCurrent(startReview(S.current,nowDemo()));render();toast('Revisión iniciada en la simulación.');}catch(e){toast(e.message);}}
 if(action==='request-correction')openDialog('correction');
 if(action==='preview-document')openDialog('document');
 if(action==='close-dialog')closeDialog();
 if(action==='download-receipt')downloadReceiptDemo();
 if(action==='new-attempt'){
   if(S.policy!=='allowed'||['submitted','upheld_pending_effect'].includes(S.current.appeal.status)){toast('Se necesita una regla institucional expresa y atender la apelación o el efecto pendiente del acuerdo.');return;}
   S.previous=structuredClone(S.current);S.draft={...sampleDraft(S.current.legal),declaration:false};go(S.draft.legal==='juridica'?'M10':'M09');
 }
});
document.addEventListener('change',event=>{
 const input=event.target;if(!input.matches('input[type=file][data-kind]'))return;
 const file=input.files?.[0];if(!file)return;
 const error=fileError(file);const kind=input.dataset.kind;
 if(error){S.errors[kind]=error;render();focusPage();return;}
 S.draft.documents=S.draft.documents.filter(f=>f.kind!==kind);
 S.draft.documents.push({kind,name:file.name,size:file.size,type:file.type});delete S.errors[kind];render();
});
document.addEventListener('submit',async event=>{
 event.preventDefault();const form=event.target;const data=new FormData(form);
 try {
 if(form.id==='identity-form'){captureIdentity();S.errors=validateIdentity(S.draft);if(Object.keys(S.errors).length){render();focusPage();return;}go('M11');}
 else if(form.id==='evidence-form'){S.errors=validateEvidence(S.draft);if(Object.keys(S.errors).length){render();focusPage();return;}go('M12');}
 else if(form.id==='review-form'){
   if(S.loading)return;
   S.draft.declaration=data.has('declaration');S.errors={...validateIdentity(S.draft),...validateEvidence(S.draft)};
   if(!S.draft.declaration)S.errors.declaration='Confirma que revisaste los datos de la postulación.';
   if(Object.keys(S.errors).length){render();focusPage();return;}
   S.loading=true;render();await new Promise(resolve=>setTimeout(resolve,400));
   const id='CCHIA-DEMO-'+String(500+(++S.version)).padStart(3,'0');
   const app=S.previous?newAttempt(S.previous,S.draft,id,S.policy,nowDemo()):receiveApplication(S.draft,id,nowDemo());
   S.current=app;S.cases.received=app;S.previous=null;S.loading=false;go('M13');
 }
 else if(form.id==='lookup-form'){
   const reference=String(data.get('reference')??'').trim().toUpperCase();const code=String(data.get('code')??'').trim();
   const found=listingRows().find(a=>a.reference===reference);
   if(!found||code!=='DEMO-SEGUIMIENTO'){S.message='No encontramos una solicitud con los datos ingresados. Revisa el folio y el código.';render();focusPage();return;}
   S.current=found;go('M14-result');
 }
 else if(form.id==='login-form'){
   if(!String(data.get('email')).includes('@')||!String(data.get('password')??'')){S.message='Completa el correo y la contraseña para explorar el acceso de ejemplo.';render();focusPage();return;}
   S.authenticated=true;S.denied=false;S.canRecordAssembly=false;go('N01');
 }
 else if(form.id==='recovery-form'){if(!form.reportValidity())return;go('M04');}
 else if(form.id==='reset-form'){
   if(!String(data.get('password')??'')||data.get('password')!==data.get('confirmation')){S.message='Las contraseñas deben estar completas y coincidir.';render();focusPage();return;}
   form.reset();go('M06');
 }
 else if(form.id==='search-form'){S.query=String(data.get('query')??'').trim();render();}
 else if(form.id==='decision-form'||form.id==='correction-request-form'){
   const reason=String(data.get('reason')??'');
   const result=form.id==='decision-form'?decideApplication(S.current,S.dialog,reason,nowDemo()):requestCorrection(S.current,reason,nowDemo());
   updateCurrent(result);closeDialog();render();toast('Constancia agregada en la simulación.');
 }
 else if(form.id==='appeal-form'){
   if(!data.has('confirm'))throw new Error('Confirma que deseas presentar la apelación.');
   const attachment=validateFileInput(document.getElementById('appeal-file'));
   const app=lodgeAppeal(S.current,String(data.get('reason')??''),nowDemo());
   if(attachment)app.appeal.attachment=attachment;
   updateCurrent(app);go('M14-result');toast('Apelación simulada; se conserva el mismo folio.');
 }
 else if(form.id==='assembly-form'){
   if(!data.has('confirm'))throw new Error('Confirma la constancia del acuerdo y tu autorización para registrarlo.');
   updateCurrent(recordAssemblyDecision(S.current,String(data.get('outcome')),String(data.get('reason')??''),String(data.get('agreement')??''),nowDemo(),{canRecordAssembly:S.canRecordAssembly,displayName:'Operador autorizado de demostración'}));
   go('M14-result');toast('Acuerdo de Asamblea incorporado en el ejemplo.');
 }
 else if(form.id==='correction-form'){
   const attachment=validateFileInput(document.getElementById('correction-file'));
   const app=answerCorrection(S.current,String(data.get('answer')??''),nowDemo());
   if(attachment)app.correctionAttachment=attachment;
   updateCurrent(app);go('M14-result');toast('Respuesta agregada al expediente de ejemplo.');
 }
 }catch(error){
   S.loading=false;
   if(document.getElementById('action-dialog')?.open)document.getElementById('dialog-error').textContent=error.message;
   else {S.message=error.message;render();focusPage();}
 }
});
window.addEventListener('hashchange',()=>{const requested=location.hash.slice(1);if(SCREEN_OPTIONS.some(([id])=>id===requested))go(requested,{seed:true});});
window.CCHIAMockup={navigate:(view,options={})=>go(view,{...options,seed:true,focus:false}),state:()=>structuredClone(S),setPolicy:policy=>{S.policy=policy;document.getElementById('policy-picker').value=policy;render();},screens:SCREEN_OPTIONS.map(([id,label])=>({id,label}))};
const initial=location.hash.slice(1);
if(SCREEN_OPTIONS.some(([id])=>id===initial))go(initial,{seed:true,focus:false});else go('M01',{focus:false});

</script>
</body>
</html>
